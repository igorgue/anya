[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anya"
version = "0.1.0"
description = "Anya Agent"
requires-python = ">=3.11"
dependencies = [
    "pynvim",
    "openai",
    "openai-agents",
    "hashids",
    "pyzmq",
    "cbor2",
    "html2text",
    "anthropic",
    "tenacity",
]

[project.scripts]
anya-daemon = "anya.server.main:main"

[tool.setuptools]
package-dir = {"" = "rplugin/python3"}

[tool.setuptools.packages.find]
where = ["rplugin/python3"]
include = ["anya*"]

[dependency-groups]
dev = [
    "ruff",
]
